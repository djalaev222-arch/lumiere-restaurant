<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lumière</title>
    <script type="text/javascript">
      // Single-Page Apps for GitHub Pages: GitHub Pages has no server-side
      // rewrite, so any deep link (e.g. /menu) 404s. This redirects the
      // request back to index.html with the path encoded in the query
      // string; index.html's own inline script decodes it back via
      // history.replaceState before React Router ever sees it.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
